# Despliegue producción con PostgreSQL.
# Se fusiona automáticamente con docker compose up.
services:
  horario-backend:
    ports:
      - "8001:8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql://horario_app:horario2026@horario-db:5432/horario_pro
      CORS_ORIGINS: https://workshift.andreacruz.es,http://localhost:5173
      BOOTSTRAP_USER_EMAIL: ${BOOTSTRAP_USER_EMAIL:-}
      BOOTSTRAP_USER_PASSWORD: ${BOOTSTRAP_USER_PASSWORD:-}
    depends_on:
      horario-db:
        condition: service_healthy

  horario-frontend:
    ports:
      - "8080:80"
    build:
      args:
        VITE_API_BASE_URL: ""
        VITE_DEV_BYPASS_AUTH: "false"
