# Extensión para VPS con PostgreSQL (sin override local).
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile postgres up -d --build
services:
  horario-backend:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-horario_app}:${POSTGRES_PASSWORD:-change-me}@horario-db:5432/${POSTGRES_DB:-horario_pro}
    depends_on:
      horario-db:
        condition: service_healthy

  horario-frontend:
    build:
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_DEV_BYPASS_AUTH: "false"
